<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 850" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="620" height="850" fill="#ffffff"/>

  <!-- arrows -->
  <line x1="310" y1="74"  x2="310" y2="112" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="310" y1="168" x2="310" y2="206" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="310" y1="508" x2="310" y2="546" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="310" y1="600" x2="310" y2="638" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="310" y1="692" x2="310" y2="730" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- User Task -->
  <rect x="190" y="20" width="240" height="54" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="310" y="53" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">User Task</text>

  <!-- Agent -->
  <rect x="190" y="114" width="240" height="54" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="310" y="147" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Agent</text>

  <!-- container of evaluable stages -->
  <rect x="110" y="208" width="400" height="300" rx="12" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
  <text x="130" y="234" font-size="13" font-weight="600" fill="#666666" letter-spacing="0.5">EVALUABLE STAGES</text>

  <rect x="130" y="246" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="269" text-anchor="middle" font-size="15" fill="#1a1a1a">Retrieval</text>

  <rect x="130" y="288" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="311" text-anchor="middle" font-size="15" fill="#1a1a1a">Tool Selection</text>

  <rect x="130" y="330" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="353" text-anchor="middle" font-size="15" fill="#1a1a1a">Tool Arguments</text>

  <rect x="130" y="372" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="395" text-anchor="middle" font-size="15" fill="#1a1a1a">Planning</text>

  <rect x="130" y="414" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="437" text-anchor="middle" font-size="15" fill="#1a1a1a">Memory</text>

  <rect x="130" y="456" width="360" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="310" y="479" text-anchor="middle" font-size="15" fill="#1a1a1a">Final Answer</text>

  <!-- Evaluation -->
  <rect x="190" y="546" width="240" height="54" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="310" y="579" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Evaluation</text>

  <!-- Error Analysis -->
  <rect x="190" y="638" width="240" height="54" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="310" y="671" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Error Analysis</text>

  <!-- Improvement -->
  <rect x="190" y="730" width="240" height="54" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="310" y="763" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Improvement</text>
</svg>
