<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 830" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="830" fill="#ffffff"/>

  <!-- connecting arrows between stacked boxes -->
  <line x1="280" y1="74"  x2="280" y2="112" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="168" x2="280" y2="206" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="262" x2="280" y2="300" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="356" x2="280" y2="394" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="450" x2="280" y2="488" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="544" x2="280" y2="582" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="638" x2="280" y2="676" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feedback loop: production traces -> evaluate -->
  <path d="M 400 705 L 560 705 L 560 235 L 402 235" fill="none" stroke="#d79b00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="578" y="470" fill="#8a5a00" font-size="14" font-style="italic" text-anchor="middle" transform="rotate(-90 578 470)">feeds back into evaluation</text>

  <!-- BUILD -->
  <rect x="160" y="20"  width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="53" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">BUILD</text>

  <!-- TEST -->
  <rect x="160" y="114" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="147" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">TEST</text>

  <!-- EVALUATE -->
  <rect x="160" y="208" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="241" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">EVALUATE</text>

  <!-- ERROR ANALYSIS -->
  <rect x="160" y="302" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="335" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">ERROR ANALYSIS</text>

  <!-- FIX -->
  <rect x="160" y="396" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="429" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">FIX</text>

  <!-- RE-EVALUATE -->
  <rect x="160" y="490" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="523" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">RE-EVALUATE</text>

  <!-- PRODUCTION -->
  <rect x="160" y="584" width="240" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="280" y="617" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">PRODUCTION</text>

  <!-- PRODUCTION TRACES -->
  <rect x="160" y="678" width="240" height="54" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="280" y="711" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">PRODUCTION TRACES</text>

  <text x="280" y="800" text-anchor="middle" font-size="14" fill="#666666">Evaluation is a loop, not a one-time score.</text>
</svg>
